name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/test-core.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/FPSSC.Tests --configuration Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FSCSR-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/SIGNING-CERT.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: FSCSR-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SIGNING-CERT.txt
          if-no-files-found: error
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set +e; gradle -p android connectedDebugAndroidTest --no-daemon; result=$?; adb logcat -d -t 2500 > android/emulator-logcat.txt; adb shell dumpsys accessibility > android/emulator-accessibility.txt; adb pull /sdcard/Android/data/com.tanuki276.fpssc/files/overlay.png android/overlay.png; exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-instrumentation-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/emulator-logcat.txt
            android/emulator-accessibility.txt
            android/overlay.png
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, android, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FSCSR-release-apk
          path: release-artifact
      - name: Publish verified 4.0.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Fq "versionName '4.0.0'" android/app/build.gradle
          cp release-artifact/app-release.apk FSCSR-4.0.0.apk
          cp release-artifact/SIGNING-CERT.txt SIGNING-CERT.txt
          sha256sum FSCSR-4.0.0.apk SIGNING-CERT.txt > SHA256SUMS
          if gh release view v4.0.0 >/dev/null 2>&1; then
            echo "v4.0.0 is already published; existing tag and assets are unchanged."
            exit 0
          fi
          gh release create v4.0.0 FSCSR-4.0.0.apk SHA256SUMS SIGNING-CERT.txt --target "$GITHUB_SHA" --title 'FSCSR 4.0.0' --notes-file docs/releases/4.0.0.md --latest
